
apiVersion: apps/v1
kind: Deployment
metadata: { name: flowforge-api, namespace: flowforge }
spec:
  replicas: 2
  selector: { matchLabels: { app: flowforge-api } }
  template:
    metadata: { labels: { app: flowforge-api } }
    spec:
      containers:
        - name: api
          image: flowforge/api:latest
          ports: [{ containerPort: 3001 }]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: flowforge-secrets, key: database-url } }
            - name: REDIS_URL
              valueFrom: { secretKeyRef: { name: flowforge-secrets, key: redis-url } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: flowforge-secrets, key: jwt-secret } }
          resources: { requests: { cpu: 250m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
          livenessProbe: { httpGet: { path: /health, port: 3001 }, initialDelaySeconds: 10, periodSeconds: 30 }
          readinessProbe: { httpGet: { path: /health, port: 3001 }, initialDelaySeconds: 5, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: flowforge-api, namespace: flowforge }
spec:
  selector: { app: flowforge-api }
  ports: [{ port: 3001, targetPort: 3001 }]
  type: ClusterIP
